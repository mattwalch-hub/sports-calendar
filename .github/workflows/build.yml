name: Build sports calendar

on:
  schedule:
    # Every 6 hours. GitHub often delays scheduled runs under load; that's fine,
    # Outlook only polls every few hours anyway.
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'build-ics.mjs'
      - 'calendars.json'
      - '.github/workflows/build.yml'

# Prevent a scheduled run and a manual run from racing to commit.
concurrency:
  group: build-ics
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships a current Node, so there is no setup step and no
      # dependencies to install -- the script uses only the standard library.
      - name: Build merged .ics
        run: node build-ics.mjs

      - name: Commit if the schedules actually changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- docs/; then
            echo "No schedule changes; nothing to commit."
          else
            git add docs/
            git commit -m "Update sports calendar"
            git push
          fi
